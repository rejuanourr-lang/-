<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viral Video Zone</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #111;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      padding: 15px;
    }

    .video-card {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .thumbnail {
      width: 100%;
      height: 200px;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
    }

    .content {
      padding: 15px;
    }

    .watch-btn {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h2>🎬 Viral Video Zone</h2>
    <p>🔥 Latest Viral Videos</p>
  </div>

  <div class="container">

    <div class="video-card">

      <div class="thumbnail">
        ▶️
      </div>

      <div class="content">
        <h3>🔥 Amazing Viral Video</h3>
        <p>👁 0 views</p>

        <button class="watch-btn" onclick="watchVideo()">
          ▶️ WATCH VIDEO
        </button>
      </div>

    </div>

  </div>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    function watchVideo() {
      alert("📺 Advertisement will appear here.\n\nAd complete হলে ভিডিও Unlock হবে.");
    }
  </script>

</body>
</html>
